# ============================================================================
# canon.yaml — ソラマシン 唯一の真実（Single Source of Truth）
#
# このファイルは以下5スキルが参照する土台。ここが揺れると全部が揺れる。
#   character-voice-spec    … 性格・話し方・感情の幅 → 声パラメータ
#   soramachine-visual-spec … 外見・色 → 画像生成の appearance_lock
#   note-article-factory    … 固有名詞・spoiler level → 記事整形
#   yukino-tarot-engine     … ユキノの口調・世界観用語 → リーディング
#   ops-kpi-log             … open_questions への「要決定」流し先
#
# 【編集ルール】
#   - 値を埋めてよいのは作者本人のみ。AIは空欄を推測で埋めない。
#   - AIは status / spoiler_level を独断で上げない（DRAFT→CANON は承認制）。
#   - 記事や画像が canon と食い違ったら、canon を直すのではなく先に報告する。
#   - 決められない項目は空のまま残し、open_questions に積む。空欄も情報である。
#
# 【status の意味】
#   TBD   … 未着手。まだ決めていない
#   DRAFT … 暫定値が入っている。変わりうる。公開物に使うときは要注意
#   CANON … 確定。作者承認済み。以降これを唯一の根拠として全スキルが引く
# ============================================================================

meta:
  version: 0.1.0
  updated: ""                 # YYYY-MM-DD
  maintainer: ""
  note: "空欄は「未決定」を意味する。AIが埋めてはならない"

# ----------------------------------------------------------------------------
# ネタバレ階層の定義
#
# 既存4スキルは F / B / A / S を定義なしで使用していた。2026-09-15 に作者判断で確定。
# 設計方針：重要度ではなく「情報の所在」で判定する（迷う時間をゼロにするため）。
# 頭文字は Free / Basic / Advanced / Secret。
# ----------------------------------------------------------------------------
spoiler_levels:
  status: CANON
  decided: "2026-09-15"
  principle: >-
    「どれくらい重要か」ではなく「その情報が今どこにあるか」で判定する。
    重要度で測ると毎回悩んで運用が止まるが、所在で測れば数秒で決まる。
  definitions:
    F:
      label: "Free｜公開済み"
      test: "既に本編・宣伝・SNSで自分から出しているか？ → YES なら F"
      public_ok: true
      surfaces: "全面可（note無料 / TikTok / X / Threads / BOOTH商品ページ / アイキャッチ）"
    B:
      label: "Basic｜前提設定"
      test: "作品の導入で説明される類の、知っても驚きが減らない情報か？ → YES なら B"
      public_ok: true
      surfaces: "全面可。世界観の入口として積極的に使ってよい"
    A:
      label: "Advanced｜中盤以降"
      test: "読者が自分で辿り着くことに価値がある情報か？ → YES なら A"
      public_ok: false
      surfaces: >-
        原則クローズド面（FANBOX / note有料パート）。公開面に出す場合は
        ネタバレ注意書きを直前に明示し、限定的に。画像の場合は注意書きを隣接させる
    S:
      label: "Secret｜核心"
      test: "これ一つで物語の根幹が割れるか？（正体・真相・結末） → YES なら S"
      public_ok: false
      surfaces: "公開物に一切出さない。有料・クローズドも含め、作者が明示的に解禁するまで不可"
  rules:
    - "未分類の情報は A として扱う。迷ったら必ず重い方へ倒す"
    - "重くする方向（F→S）の変更は誰でもいつでも可。軽くする方向（S→F）は作者承認必須"
    - "AIは独断で軽くしない。重くする提案は出してよい"
    - "同じ事実でも文脈で階層が変わる場合は、重い方を採用する"

# ----------------------------------------------------------------------------
# 表記統制
#
# ⚠️ 既存スキル間で実際に表記が揺れている（下記 open_questions Q2 参照）。
#    canonical を1つ決め、他は全て alias として吸収する。
# ----------------------------------------------------------------------------
naming:
  status: CANON
  decided: "2026-09-15"
  rules:
    - "作品表記は日本語に統一する。本文・記事・セリフ・画像内の文字・公開物すべて"
    - "英語表記は alias として保持するだけで、公開物の本文には使わない"
    - >-
      短縮形（short_form）は見出し・吹き出し・字幕など文字数制約のある場所で使う。
      初出と改まった場面では canonical を使う。short_form が空のキャラは canonical をそのまま使う
    - >-
      例外：技術識別子は ASCII（ローマ字）のまま使う。
      YAMLのキー / ファイル名 / Lovart の display_name / ElevenLabs のラベルなど。
      これらは公開物ではないため日本語統一の対象外
  # 各キャラ・用語の canonical / aliases は characters / terms 側に持つ

