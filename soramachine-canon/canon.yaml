# ============================================================================
# canon.yaml — ソラマシン 唯一の真実（Single Source of Truth）
#
# このファイルは以下5スキルが参照する土台。ここが揺れると全部が揺れる。
#   character-voice-spec    … 性格・話し方・感情の幅 → 声パラメータ
#   soramachine-visual-spec … 外見・色 → 画像生成の appearance_lock
#   note-article-factory    … 固有名詞・spoiler level → 記事整形
#   yukino-tarot-engine     … ユキノの口調・世界観用語 → リーディング
#   ops-kpi-log             … open_questions への「要決定」流し先
#
# 【編集ルール】
#   - 値を埋めてよいのは作者本人のみ。AIは空欄を推測で埋めない。
#   - AIは status / spoiler_level を独断で上げない（DRAFT→CANON は承認制）。
#   - 記事や画像が canon と食い違ったら、canon を直すのではなく先に報告する。
#   - 決められない項目は空のまま残し、open_questions に積む。空欄も情報である。
#
# 【status の意味】
#   TBD   … 未着手。まだ決めていない
#   DRAFT … 暫定値が入っている。変わりうる。公開物に使うときは要注意
#   CANON … 確定。作者承認済み。以降これを唯一の根拠として全スキルが引く
# ============================================================================

meta:
  version: 0.1.0
  updated: ""                 # YYYY-MM-DD
  maintainer: ""
  note: "空欄は「未決定」を意味する。AIが埋めてはならない"

# ----------------------------------------------------------------------------
# ネタバレ階層の定義
#
# ⚠️ 既存スキルは F / B / A / S を定義なしで使用している。
#    以下は「F < B < A < S の順に重い」という一般的なランク表記からの【推測】。
#    作者が確認し、status を CANON にすること。
# ----------------------------------------------------------------------------
spoiler_levels:
  status: DRAFT               # ← 作者確認まで DRAFT
  definitions:
    F:
      label: ""               # 例: "誰に見せてもよい。既に公開済みの情報"
      public_ok: true         # note無料 / TikTok / X / BOOTH商品ページ
    B:
      label: ""               # 例: "序盤で明かされる。公開してよい"
      public_ok: true
    A:
      label: ""               # 例: "中盤以降の重要情報。クローズド面のみ"
      public_ok: false        # FANBOX等の有料/限定面で注意書き付き
    S:
      label: ""               # 例: "核心。公開物に一切出さない"
      public_ok: false        # 無料・有料を問わず公開物に出さない

# ----------------------------------------------------------------------------
# 表記統制
#
# ⚠️ 既存スキル間で実際に表記が揺れている（下記 open_questions Q2 参照）。
#    canonical を1つ決め、他は全て alias として吸収する。
# ----------------------------------------------------------------------------
naming:
  status: TBD
  rules: []                   # 例: 日本語本文でのキャラ表記は日本語名に統一、など
  # 各キャラ・用語の canonical / aliases は characters / terms 側に持つ

# ----------------------------------------------------------------------------
# 世界観の骨格
# ----------------------------------------------------------------------------
world:
  status: TBD
  logline: ""                 # 1〜2文。作品を1行で言い切る
  setting: ""                 # 舞台・時代・場所
  core_rules: []              # 世界の物理法則・禁則。ここが矛盾の温床になるので明文化する
  themes: []                  # 作品が扱う主題
  tone: ""                    # 語りの温度。visual-spec の style_lock の根拠にもなる
  palette:                    # 作品全体の色設計 → visuals.yaml が引く
    status: TBD
    colors: []                # 例: ["#0B1026", "#E8D7A2"]
    rationale: ""

# ----------------------------------------------------------------------------
# 固有名詞辞書
#
# note-article-factory / yukino-tarot-engine が「世界観用語」として引く。
# 公開記事・無料リーディングに出せるかは spoiler_level で判定される。
# ----------------------------------------------------------------------------
terms:
  # テンプレート（1件をコピーして使う）
  _template:
    canonical: ""             # 正式表記
    aliases: []               # 表記ゆれ・略称・英語表記
    category: ""              # concept / artifact / faction / place / phenomenon / currency
    definition: ""            # 1〜3文。ここが唯一の定義
    first_appearance: ""      # 初出（arc / 話数）
    spoiler_level: TBD        # F / B / A / S
    status: TBD
    related: []               # 関連する用語キー

  # 以下、ユーザー設定で言及されている語。定義は全て作者が記入する。
  ark_soramachine:  { canonical: "アーク・ソラマシン", aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }
  astral_code:      { canonical: "アストラル・コード", aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }
  astral_mural:     { canonical: "アストラル壁画",     aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }
  gadget_crash:     { canonical: "ガジェット・クラッシュ", aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }
  hydra:            { canonical: "HYDRA",              aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }
  seika:            { canonical: "星貨",               aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }
  shadow_echo:      { canonical: "Shadow Echo",        aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }
  missing_emotion_file: { canonical: "Missing Emotion File", aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }
  kakera_no_yume:   { canonical: "欠片の夢",           aliases: [], category: "", definition: "", spoiler_level: TBD, status: TBD }

